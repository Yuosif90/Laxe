<style>
/* Layout: one narrow column. Saved lists on top, message editor, a collapsed "add numbers" box, then a ledger of orders with one WhatsApp action per row. Burgundy accent. */
:root {
  --bg: #f8f4f5;
  --surface: #ffffff;
  --fg: #2a1a1f;
  --muted: #6f5a61;
  --line: #e6d9dd;
  --accent: #8a1c3c;
  --accent-fg: #ffffff;
  --done-bg: #f6e8ec;
  --done-fg: #8a1c3c;
  --font-display: "Noto Naskh Arabic", "Geeza Pro", "Noto Sans Arabic", serif;
  --font-body: "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181012; --surface: #22181b; --fg: #f4e9ec; --muted: #b8a1a8; --line: #3a2a2f;
    --accent: #c9415f; --accent-fg: #ffffff; --done-bg: #2e1b21; --done-fg: #eb8da4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181012; --surface: #22181b; --fg: #f4e9ec; --muted: #b8a1a8; --line: #3a2a2f;
  --accent: #c9415f; --accent-fg: #ffffff; --done-bg: #2e1b21; --done-fg: #eb8da4; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-inline: 16px; padding-block: 20px 48px;
}
.wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--font-display); font-size: 1.9rem; line-height: 1.25; margin: 0; text-wrap: balance; }
.meta { color: var(--muted); font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 0; }
.meta b { color: var(--fg); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

.listbar { display: flex; gap: 8px; }
select, input[type="text"], textarea {
  font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0;
}
select { flex: 1; min-height: 44px; }
input[type="text"] { width: 100%; min-height: 44px; }
textarea { width: 100%; resize: vertical; line-height: 1.7; }
select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.editor { display: flex; flex-direction: column; gap: 8px; }
.editor label, .lbl { font-weight: 600; font-size: 0.95rem; }
#msg { min-height: 6.5rem; }

details.add { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.add > summary {
  min-height: 48px; display: flex; align-items: center; padding-inline: 14px; cursor: pointer;
  font-weight: 600; list-style: none; color: var(--accent);
}
details.add > summary::-webkit-details-marker { display: none; }
details.add > summary::after { content: "＋"; margin-inline-start: auto; }
details.add[open] > summary::after { content: "－"; }
.addbody { display: flex; flex-direction: column; gap: 12px; padding: 4px 14px 16px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab {
  font: inherit; font-size: 0.9rem; min-height: 44px; padding-inline: 12px; background: none; border: 0;
  border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer;
}
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.pane { display: flex; flex-direction: column; gap: 8px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tool {
  min-height: 44px; padding-inline: 14px; border-radius: 6px; font: inherit; font-size: 0.9rem;
  background: transparent; color: var(--fg); border: 1px solid var(--line); cursor: pointer;
}
.tool.main { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.tool:disabled { opacity: 0.5; cursor: progress; }
.tool.warn { border-color: var(--accent); color: var(--accent); }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; }
.thumbs img { height: 72px; width: auto; max-width: 100%; border-radius: 4px; border: 1px solid var(--line); }
.status { color: var(--muted); font-size: 0.88rem; margin: 0; min-height: 1.2em; }
#paste { min-height: 7rem; font-family: var(--font-mono); font-size: 0.85rem; direction: ltr; text-align: left; }

.bar { display: flex; flex-direction: column; gap: 8px; }
.bar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.bar-top button {
  font: inherit; font-size: 0.85rem; color: var(--muted); background: none;
  border: 0; padding: 8px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }

.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.empty { padding-block: 24px; color: var(--muted); text-align: center; }
.row {
  display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding-block: 14px; border-bottom: 1px solid var(--line);
}
.row .n { color: var(--muted); font-size: 0.85rem; text-align: center; }
.info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.phone { font-family: var(--font-mono); font-size: 1.05rem; direction: ltr; text-align: right; unicode-bidi: plaintext; letter-spacing: 0.02em; }
.sub { color: var(--muted); font-size: 0.85rem; display: flex; flex-wrap: wrap; gap: 0 12px; }
.sub span { direction: ltr; unicode-bidi: plaintext; overflow-wrap: anywhere; }
.sub .amt { color: var(--fg); font-weight: 600; }
.actions { display: flex; gap: 8px; align-items: center; }
.wa {
  display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 7.5rem;
  padding-inline: 16px; border-radius: 6px; background: var(--accent); color: var(--accent-fg);
  font-weight: 600; font-size: 0.95rem; text-decoration: none;
}
.wa:hover { filter: brightness(1.1); }
.copy {
  min-height: 44px; padding-inline: 12px; border-radius: 6px; font: inherit; font-size: 0.85rem;
  background: transparent; color: var(--fg); border: 1px solid var(--line); cursor: pointer;
}
.row.opened { background: var(--done-bg); }
.row.opened .wa { background: transparent; color: var(--done-fg); border: 1px solid var(--done-fg); }
.row.opened .n { color: var(--done-fg); }

@media (max-width: 480px) {
  .row { grid-template-columns: 1.6rem minmax(0, 1fr); }
  .actions { grid-column: 1 / -1; padding-inline-start: calc(1.6rem + 12px); }
  .wa { flex: 1; }
  h1 { font-size: 1.6rem; }
}
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
var DEFAULT_MSG = "سلاڤ، تەلەبیەکا تە هەیە ژ دەڤ کۆمپانیا مە. هیڤی دکەین تەلەفۆنا خو ل نک خو هەبیت، ل ماوێ چەند خولەکەکێ دا تەلەبیا تە دێ گەهیتە تە.";

// [code, phone, place, total]
var DEFAULT_ORDERS = [
  ["35290","07508989581","Baroshke",30000],
  ["35300","07514904703","baroshke",21000],
  ["35305","07504217269","baroshke",25000],
  ["35311","07504819715","Nezik Xasta Azadi",21000],
  ["35353","07505054320","Baroshke",21000],
  ["35370","07507755382","Baroshke",12000],
  ["35380","07514600610","7ayshrta- mosa gizi",25000],
  ["35383","07515490209","Hai Shrta bni",30000],
  ["35384","07507883160","Hai Shrta Bni",25000],
  ["35389","07511070755","sarhildan tower",25000],
  ["35409","07518013287","hayl gzma",30000],
  ["35438","07503710197","Eminke",33000],
  ["35439","07507351180","Besre",39000],
  ["35465","07508580485","barushke",55000],
  ["35471","07507289868","bn nadi duhok",27000],
  ["35489","07503652123","7ayshrta bni",18000],
  ["35497","07503340530","Hai Shrta Sari",55000],
  ["35499","07501331141","m7ala shele",21000],
  ["35502","07504315424","barushke",21000],
  ["35511","07504124793","duhok-m7ala shele",25000],
  ["35522","07507120814","BARUSHKE",21000],
  ["35525","07507202130","besre",60000],
  ["35530","07515583653","Hai Jzma",21000],
  ["35534","07511859515","besre",12000],
  ["35539","07509175565","Baroshke",61000],
  ["35546","07503096981","Sike NEzik Dolar Center",48000],
  ["35547","07504506925","barushke",41000],
  ["35557","07505592311","Gre base",98000],
  ["35570","07507417833","7ay jzma",21000],
  ["35574","07514401574","Baroshke Nojeen City",12000],
  ["35576","07507312658","sike- nezik xan kebab",25000],
  ["35581","07502462993","nzarkani",56000],
  ["35584","07503932696","etit",21000],
  ["35589","07515397105","Kevla",25000]
];

var KEY_LISTS = "wa-lists-v3", KEY_CUR = "wa-cur-v3", KEY_MSG = "rayan-msg-20261013";
var nf = new Intl.NumberFormat("en-US");
var msgEl = document.getElementById("msg");
var listEl = document.getElementById("list");
var selEl = document.getElementById("listSel");
var pasteEl = document.getElementById("paste");
var nameEl = document.getElementById("listName");
var statusEl = document.getElementById("pasteMsg");
var thumbsEl = document.getElementById("thumbs");

function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function toAr(n) { return String(n).replace(/\d/g, function (d) { return "٠١٢٣٤٥٦٧٨٩"[d]; }); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function say(t) { statusEl.textContent = t; }
function normDigits(s) {
  return String(s).replace(/[٠-٩]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); })
                  .replace(/[۰-۹]/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹".indexOf(d); });
}

// ---------- saved lists ----------
var lists = [], cur = null;
function newId() { return "l" + Date.now() + Math.floor(Math.random() * 1000); }

try {
  var s = JSON.parse(load(KEY_LISTS) || "null");
  if (Array.isArray(s) && s.length) lists = s;
} catch (e) {}
if (!lists.length) lists = [{ id: "default", name: "RAYAN ١٣-١٠-٢٠٢٦", orders: DEFAULT_ORDERS, opened: {} }];
var curId = load(KEY_CUR);
cur = lists.filter(function (l) { return l.id === curId; })[0] || lists[0];
msgEl.value = load(KEY_MSG) || DEFAULT_MSG;

function persist() { save(KEY_LISTS, JSON.stringify(lists)); save(KEY_CUR, cur.id); }

function renderSelect() {
  selEl.innerHTML = "";
  lists.forEach(function (l) {
    var o = document.createElement("option");
    o.value = l.id;
    o.textContent = l.name + " (" + toAr(l.orders.length) + ")";
    if (l === cur) o.selected = true;
    selEl.appendChild(o);
  });
}

// ---------- rendering ----------
function waUrl(phone) {
  return "https://wa.me/964" + phone.replace(/^0+/, "") + "?text=" + encodeURIComponent(msgEl.value);
}

function subLine(o) {
  var parts = [];
  if (o[0]) parts.push('<span>#' + esc(o[0]) + '</span>');
  if (o[2]) parts.push('<span>' + esc(o[2]) + '</span>');
  if (o[3]) parts.push('<span class="amt">' + nf.format(o[3]) + ' IQD</span>');
  return parts.length ? '<div class="sub">' + parts.join("") + '</div>' : "";
}

function build() {
  renderSelect();
  document.getElementById("listinfo").innerHTML =
    '<span>لیست: <b>' + esc(cur.name) + '</b></span><span>ژمارە: <b class="num">' + toAr(cur.orders.length) + '</b></span>';
  document.getElementById("total").textContent = toAr(cur.orders.length);
  listEl.innerHTML = "";
  if (!cur.orders.length) {
    listEl.innerHTML = '<li class="empty">ژمارە نینن. ژمارەیان زێدە بکە.</li>';
  }
  cur.orders.forEach(function (o, i) {
    var li = document.createElement("li");
    li.className = "row" + (cur.opened[o[1]] ? " opened" : "");
    li.dataset.key = o[1];
    li.innerHTML =
      '<div class="n num">' + toAr(i + 1) + '</div>' +
      '<div class="info"><div class="phone">' + esc(o[1]) + '</div>' + subLine(o) + '</div>' +
      '<div class="actions">' +
        '<a class="wa" target="_blank" rel="noopener" href="' + waUrl(o[1]) + '">وەتسئاپ</a>' +
        '<button type="button" class="copy" data-phone="' + esc(o[1]) + '">کۆپی</button>' +
      '</div>';
    listEl.appendChild(li);
  });
  progress();
}

function refreshLinks() {
  var links = listEl.querySelectorAll(".wa");
  cur.orders.forEach(function (o, i) { if (links[i]) links[i].href = waUrl(o[1]); });
}

function progress() {
  var n = cur.orders.filter(function (o) { return cur.opened[o[1]]; }).length;
  document.getElementById("count").textContent = toAr(n);
  document.getElementById("fill").style.width = (cur.orders.length ? n / cur.orders.length * 100 : 0) + "%";
}

msgEl.addEventListener("input", function () { save(KEY_MSG, msgEl.value); refreshLinks(); });

selEl.addEventListener("change", function () {
  cur = lists.filter(function (l) { return l.id === selEl.value; })[0] || lists[0];
  persist(); build();
});

var delArmed = null;
var delBtn = document.getElementById("delList");
delBtn.addEventListener("click", function () {
  if (!delArmed) {
    delBtn.textContent = "دڵنیایی؟ دووبارە کلیک بکە";
    delBtn.classList.add("warn");
    delArmed = setTimeout(disarm, 3500);
    return;
  }
  disarm();
  lists = lists.filter(function (l) { return l !== cur; });
  if (!lists.length) lists = [{ id: newId(), name: "لیستا نو", orders: [], opened: {} }];
  cur = lists[0];
  persist(); build();
});
function disarm() {
  clearTimeout(delArmed); delArmed = null;
  delBtn.textContent = "سڕینەوە"; delBtn.classList.remove("warn");
}

listEl.addEventListener("click", function (e) {
  var row = e.target.closest(".row");
  if (!row) return;
  if (e.target.closest(".wa")) {
    cur.opened[row.dataset.key] = 1;
    row.classList.add("opened");
    persist(); progress();
    return;
  }
  var btn = e.target.closest(".copy");
  if (btn) {
    var done = function () { btn.textContent = "کۆپی بوو"; setTimeout(function () { btn.textContent = "کۆپی"; }, 1400); };
    var fallback = function () {
      var r = document.createRange();
      r.selectNodeContents(row.querySelector(".phone"));
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    };
    try { navigator.clipboard.writeText(btn.dataset.phone).then(done, fallback); } catch (err) { fallback(); }
  }
});

document.getElementById("reset").addEventListener("click", function () {
  cur.opened = {};
  persist(); build();
});

// ---------- parsing numbers ----------
var PHONE_G = /(^|\D)(?:\+?964[\s-]?|0)?(7\d{2})[\s-]?(\d{3})[\s-]?(\d{4})(?!\d)/g;
var PHONE_1 = /(^|\D)(?:\+?964[\s-]?|0)?(7\d{2})[\s-]?(\d{3})[\s-]?(\d{4})(?!\d)/;

function firstPhone(s) {
  var m = PHONE_1.exec(normDigits(s));
  return m ? "0" + m[2] + m[3] + m[4] : null;
}
function toNum(s) {
  var n = parseInt(normDigits(s).replace(/[^\d]/g, ""), 10);
  return isNaN(n) ? null : n;
}

function parseRows(text) {
  var out = [];
  normDigits(text).split(/\r?\n/).forEach(function (line) {
    if (!line.trim()) return;
    if (line.indexOf("|") > -1) {
      var p = line.split("|").map(function (x) { return x.trim(); });
      if (p.length >= 4) {
        var ph = firstPhone(p[1]);
        if (ph) { out.push([p[0].replace(/\D/g, "") || null, ph, p[2], toNum(p[3])]); return; }
      }
    }
    var found = [];
    var rest = line.replace(PHONE_G, function (m, pre, a, b, c) { found.push("0" + a + b + c); return pre + " "; });
    if (!found.length) return;
    var nums = [], words = [];
    rest.split(/\s+/).filter(Boolean).forEach(function (t) {
      if (/^\d{1,3}([,.]\d{3})+$/.test(t) || /^\d{4,7}$/.test(t)) nums.push(t); else words.push(t);
    });
    var code = null, total = null;
    if (found.length === 1) {
      if (nums.length >= 2) { code = nums[0]; total = toNum(nums[nums.length - 1]); }
      else if (nums.length === 1) total = toNum(nums[0]);
    }
    found.forEach(function (p) { out.push([code, p, found.length === 1 ? words.join(" ") : "", found.length === 1 ? total : null]); });
  });
  return out;
}

function mapRows(arr) {
  var out = [];
  if (!Array.isArray(arr)) return out;
  arr.forEach(function (x) {
    if (!x) return;
    var ph = firstPhone(String(x.phone || ""));
    if (!ph) return;
    var code = normDigits(String(x.code == null ? "" : x.code)).replace(/\D/g, "") || null;
    out.push([code, ph, String(x.place || "").trim(), toNum(String(x.total == null ? "" : x.total))]);
  });
  return out;
}

function rowToLine(o) { return [o[0] || "", o[1], o[2] || "", o[3] || ""].join(" | "); }

function uniqueRows(rows, seen) {
  var out = [];
  rows.forEach(function (o) { if (!seen[o[1]]) { seen[o[1]] = 1; out.push(o); } });
  return out;
}

function putInBox(found) {
  var cur0 = pasteEl.value.trim();
  pasteEl.value = (cur0 ? cur0 + "\n" : "") + found.map(rowToLine).join("\n");
  say(found.length ? "دیتن: " + toAr(found.length) + " ژمارە. ڕاستی بکە و لیستێ بپارێزە." : "چ ژمارە نەهاتنە دیتن.");
}

// ---------- create / append ----------
function autoName() {
  var d = new Date();
  return "لیست " + toAr(d.getDate()) + "-" + toAr(d.getMonth() + 1) + " " + toAr(String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"));
}

document.getElementById("make").addEventListener("click", function () {
  var rows = uniqueRows(parseRows(pasteEl.value), {});
  if (!rows.length) { say("چ ژمارەیێن دروست نەهاتنە دیتن."); return; }
  var l = { id: newId(), name: nameEl.value.trim() || autoName(), orders: rows, opened: {} };
  lists.push(l); cur = l;
  persist(); build();
  pasteEl.value = ""; nameEl.value = ""; thumbsClear();
  say("هاتە پاراستن: " + l.name);
  document.getElementById("addBox").open = false;
});

document.getElementById("append").addEventListener("click", function () {
  var seen = {};
  cur.orders.forEach(function (o) { seen[o[1]] = 1; });
  var rows = uniqueRows(parseRows(pasteEl.value), seen);
  if (!rows.length) { say("چ ژمارەیێن نو نەهاتنە دیتن."); return; }
  cur.orders = cur.orders.concat(rows);
  persist(); build();
  pasteEl.value = ""; thumbsClear();
  say("هاتن زێدەکرن: " + toAr(rows.length));
  document.getElementById("addBox").open = false;
});

// ---------- tabs ----------
document.querySelectorAll(".tab").forEach(function (t) {
  t.addEventListener("click", function () {
    document.querySelectorAll(".tab").forEach(function (x) {
      var on = x === t;
      x.setAttribute("aria-selected", on ? "true" : "false");
      if (x.dataset.pane) document.getElementById(x.dataset.pane).hidden = !on;
    });
    if (t.id === "tab-text") pasteEl.focus();
  });
});

// ---------- reading with Claude ----------
var sampleFn = null, imgLimits = null;
var initP = (async function () {
  try {
    if (!window.claude || !window.claude.use) return;
    sampleFn = await window.claude.use("sample");
    if (sampleFn) {
      var l = await sampleFn.limits().catch(function () { return null; });
      imgLimits = (l && l.images) || null;
    }
  } catch (e) {}
})();

var busyBtns = ["btnCam", "btnGal", "btnPdf"].map(function (id) { return document.getElementById(id); });
function setBusy(b) { busyBtns.forEach(function (x) { x.disabled = b; }); }

function errCopy(e) {
  var c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled") return "ڕێگە نەهاتە دان بو Claude. ژمارەیان ب دەستی بنڤیسە.";
  if (c === "rate_limited") return "گەلەک داخازی هاتنە کرن. ماوەکێ ببە و دووبارە بکە.";
  if (c === "image_rejected") return "ئەڤ وێنە نەهاتە قبوولکرن. وێنەکێ دی هلبژێرە.";
  if (c === "images_unavailable") return "خواندنا وێنەی ل ڤێرێ بەردەست نینە. ژمارەیان ژ وێنەی ب دەستی بنڤیسە.";
  return "نەهاتە خواندن. دووبارە بکە یان ب دەستی بنڤیسە.";
}

var ROW_SPEC = 'Each row has: "code" (the invoice/order number, usually 5 digits), "phone" (customer Iraqi mobile number, 11 digits starting with 07), ' +
  '"place" (the delivery place or address text exactly as printed), "total" (the amount printed on that row, digits only, no separators). ' +
  'Use null for any field you cannot read with certainty. Never guess digits. Skip header and summary rows. ' +
  'Reply with only a JSON array like [{"code":"35290","phone":"07508989581","place":"Baroshke","total":30000}].';

async function readImages(blobs) {
  var arr = await sampleFn.json(
    "These images show a delivery report or paper listing customer orders. Extract one object per order row, in order. " + ROW_SPEC,
    { images: blobs.slice(0, imgLimits.maxCount) }
  );
  return mapRows(arr);
}

async function structureText(text) {
  var arr = await sampleFn.json(
    "Below is text extracted from a driver's delivery invoice report (columns may be in any order). Extract one object per invoice row. " + ROW_SPEC + "\n\n" + text.slice(0, 120000)
  );
  return mapRows(arr);
}

function thumbsClear() {
  thumbsEl.querySelectorAll("img").forEach(function (i) { try { URL.revokeObjectURL(i.src); } catch (e) {} });
  thumbsEl.innerHTML = "";
}

async function onPhotos(input) {
  var files = Array.prototype.slice.call(input.files || []);
  input.value = "";
  if (!files.length) return;
  thumbsClear();
  files.forEach(function (f) {
    var im = document.createElement("img");
    im.alt = "";
    try { im.src = URL.createObjectURL(f); } catch (e) {}
    thumbsEl.appendChild(im);
  });
  setBusy(true);
  say("دخوینم... ئەڤە دشێت چەند چرکەکان بخوازیت.");
  try {
    await initP;
    if (!sampleFn || !imgLimits) { say("خواندنا ب Claude ل ڤێرێ بەردەست نینە. وێنە ل سەرێ دیارە، ژمارەیان ژ وێ ب دەستی بنڤیسە."); setBusy(false); return; }
    putInBox(await readImages(files));
  } catch (e) { say(errCopy(e)); }
  setBusy(false);
}

async function pdfRead(buf) {
  if (!window.pdfjsLib) throw { code: "no_pdf" };
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  var text = "", pages = [];
  for (var p = 1; p <= pdf.numPages; p++) {
    var page = await pdf.getPage(p);
    var c = await page.getTextContent();
    var rows = {};
    c.items.forEach(function (i) {
      if (!i.str.trim()) return;
      var y = Math.round(i.transform[5] / 4);
      (rows[y] = rows[y] || []).push(i);
    });
    Object.keys(rows).map(Number).sort(function (a, b) { return b - a; }).forEach(function (y) {
      text += rows[y].sort(function (a, b) { return a.transform[4] - b.transform[4]; })
        .map(function (i) { return i.str; }).join(" ") + "\n";
    });
    pages.push(page);
  }
  return { text: text, pages: pages };
}

async function pagesToImages(pages, max) {
  var out = [];
  for (var i = 0; i < Math.min(pages.length, max); i++) {
    var vp = pages[i].getViewport({ scale: 1.6 });
    var cv = document.createElement("canvas");
    cv.width = vp.width; cv.height = vp.height;
    await pages[i].render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    out.push(await new Promise(function (res) { cv.toBlob(res, "image/jpeg", 0.85); }));
  }
  return out;
}

async function onPdf(input) {
  var file = input.files && input.files[0];
  input.value = "";
  if (!file) return;
  thumbsClear();
  setBusy(true);
  say("دخوینم...");
  try {
    var r = await pdfRead(await file.arrayBuffer());
    await initP;
    var found = [];
    if (r.text.trim() && sampleFn) {
      try { found = await structureText(r.text); } catch (e) { found = []; }
    }
    if (!found.length) found = parseRows(r.text);
    if (!found.length && sampleFn && imgLimits) {
      say("PDF وەک وێنەیە، Claude دخوینیت...");
      found = await readImages(await pagesToImages(r.pages, imgLimits.maxCount));
    }
    putInBox(uniqueRows(found, {}));
  } catch (e) { say(errCopy(e && e.code && e.code !== "no_pdf" ? e : { code: "x" })); }
  setBusy(false);
}

function pick(btnId, inputId) {
  document.getElementById(btnId).addEventListener("click", function () { document.getElementById(inputId).click(); });
}
pick("btnCam", "fCam"); pick("btnGal", "fGal"); pick("btnPdf", "fPdf");
document.getElementById("fCam").addEventListener("change", function () { onPhotos(this); });
document.getElementById("fGal").addEventListener("change", function () { onPhotos(this); });
document.getElementById("fPdf").addEventListener("change", function () { onPdf(this); });

build();
</script>
